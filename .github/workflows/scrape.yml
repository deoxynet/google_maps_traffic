name: Traffic Scraper

on:
  schedule:
    # Every 5 minutes during peak hours (5 AM - 10 PM PST = 13:00 - 06:00 UTC)
    - cron: '*/5 13-23 * * *'  # 1 PM - 11 PM UTC (5 AM - 3 PM PST)
    - cron: '*/5 0-6 * * *'    # 12 AM - 6 AM UTC (4 PM - 10 PM PST)
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: scraper

      - name: Build scraper
        run: cargo build --release --example scrape_la

      - name: Fetch traffic data
        run: |
          R2_KEY=$(cargo run --release --example scrape_la 2>scrape.log)
          cat scrape.log
          echo "R2_KEY=$R2_KEY" >> "$GITHUB_ENV"
          echo "Destination: $R2_KEY"

      - name: Install wrangler
        run: npm install -g wrangler

      - name: Configure wrangler auth
        run: |
          mkdir -p "$HOME/.config/.wrangler/config"
          cat > "$HOME/.config/.wrangler/config/default.toml" << EOF
          oauth_token = "placeholder"
          refresh_token = "${{ secrets.WRANGLER_REFRESH_TOKEN }}"
          EOF

      - name: Upload to R2
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          wrangler r2 object put "gmaps-traffic/${{ env.R2_KEY }}" \
            --file snapshot.json.gz \
            --content-type application/gzip \
            --remote
          echo "Uploaded to r2://gmaps-traffic/${{ env.R2_KEY }}"
