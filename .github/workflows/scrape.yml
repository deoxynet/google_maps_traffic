name: Traffic Scraper

on:
  schedule:
    # Every 5 minutes, around the clock (overnight snapshots give the free-flow baseline)
    - cron: '*/5 * * * *'
    # Weekly keepalive: GitHub disables scheduled workflows in public repos after 60 days without activity
    - cron: '17 12 * * 1'
  workflow_dispatch:

jobs:
  keepalive:
    if: github.event.schedule == '17 12 * * 1'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Re-enable this workflow (resets the inactivity timer)
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/scrape.yml/enable"

  scrape:
    if: github.event.schedule != '17 12 * * 1'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: scraper

      - name: Build scraper
        run: cargo build --release --example scrape_la

      - name: Fetch traffic data
        run: |
          cargo run --release --example scrape_la 2>scrape.log > upload_manifest.txt
          cat scrape.log
          echo "--- Upload manifest ---"
          cat upload_manifest.txt

      - name: Upload to R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ENDPOINT: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
        run: |
          while read filepath r2_key; do
            echo "Uploading $filepath → r2://gmaps-traffic/$r2_key"
            aws s3 cp "$filepath" "s3://gmaps-traffic/$r2_key" \
              --endpoint-url "$R2_ENDPOINT" \
              --content-type application/gzip \
              --storage-class STANDARD_IA
          done < upload_manifest.txt
          echo "All uploads complete"
