name: Traffic Scraper

on:
  schedule:
    # Every 5 minutes during peak hours (5 AM - 10 PM PST = 13:00 - 06:00 UTC)
    - cron: '*/5 13-23 * * *'  # 1 PM - 11 PM UTC (5 AM - 3 PM PST)
    - cron: '*/5 0-6 * * *'    # 12 AM - 6 AM UTC (4 PM - 10 PM PST)
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: scraper

      - name: Build scraper
        run: cargo build --release --example scrape_la

      - name: Fetch traffic data
        run: |
          cargo run --release --example scrape_la 2>scrape.log > upload_manifest.txt
          cat scrape.log
          echo "--- Upload manifest ---"
          cat upload_manifest.txt

      - name: Upload to R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ENDPOINT: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
        run: |
          while read filepath r2_key; do
            echo "Uploading $filepath → r2://gmaps-traffic/$r2_key"
            aws s3 cp "$filepath" "s3://gmaps-traffic/$r2_key" \
              --endpoint-url "$R2_ENDPOINT" \
              --content-type application/gzip
          done < upload_manifest.txt
          echo "All uploads complete"
