<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>DTLA Traffic Simulator</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #000;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    font-family: 'SF Mono', 'Fira Code', monospace;
    color: #aac;
    overflow: hidden;
  }
  #main { max-width: 100vw; max-height: 100vh; }
  .panel {
    position: fixed;
    background: rgba(4, 6, 20, 0.82);
    backdrop-filter: blur(8px);
    padding: 12px 16px;
    border-radius: 10px;
    border: 1px solid rgba(100, 140, 255, 0.12);
    font-size: 11px;
    z-index: 10;
  }
  #controls {
    top: 12px; right: 12px;
    min-width: 220px;
  }
  #controls h3 {
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    color: #6af;
    margin-bottom: 10px;
  }
  #controls label {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 4px;
    color: #89a;
  }
  #controls input[type="range"] { width: 100px; accent-color: #4af; }
  #stats {
    top: 12px; left: 12px;
    color: #6ae;
    line-height: 1.6;
  }
  #clock {
    bottom: 20px; left: 50%;
    transform: translateX(-50%);
    font-size: 28px;
    letter-spacing: 4px;
    color: #4ae;
    text-shadow: 0 0 20px rgba(60, 160, 255, 0.5);
  }
  #loading {
    position: fixed;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    font-size: 14px;
    color: #4af;
    letter-spacing: 2px;
  }
</style>
</head>
<body>

<canvas id="main"></canvas>
<div id="loading">LOADING TRAFFIC DATA...</div>
<div id="stats" class="panel" style="display:none"></div>
<div id="clock" class="panel" style="display:none"></div>
<div id="controls" class="panel" style="display:none">
  <h3>Traffic Simulator</h3>
  <label>brightness <input type="range" id="cBright" min="5" max="150" value="55"></label>
  <label>bloom glow <input type="range" id="cBloomMix" min="0" max="500" value="55"></label>
  <label>trail <input type="range" id="cTrail" min="0" max="500" value="0"></label>
  <label>density <input type="range" id="cDensity" min="5" max="200" value="65"></label>
  <label>day speed <input type="range" id="cDaySpeed" min="0" max="1000" value="20"></label>
  <label>jitter <input type="range" id="cJitter" min="0" max="5" value="0" step="0.1"></label>
  <label>gravity <input type="range" id="cGravity" min="0" max="100" value="50"></label>
</div>

<script type="module">
import init, { Simulator } from './pkg/web_sim.js';

const SLIDER_MAP = {
  cBright:   'brightness',
  cBloomMix: 'bloom_mix',
  cTrail:    'trail',
  cDensity:  'density',
  cDaySpeed: 'day_speed',
  cJitter:   'jitter',
  cGravity:  'gravity',
};

async function main() {
  await init();

  const loadEl = document.getElementById('loading');
  let graphJson;
  try {
    loadEl.textContent = 'FETCHING TRAFFIC DATA...';
    const resp = await fetch('graph.json');
    if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
    graphJson = await resp.text();
    loadEl.textContent = 'PARSING GRAPH...';
    await new Promise(r => setTimeout(r, 0)); // let DOM update
  } catch (err) {
    loadEl.textContent = 'Error: ' + err.message;
    loadEl.style.color = '#f44';
    return;
  }

  let sim;
  try {
    sim = new Simulator('main', graphJson);
  } catch (err) {
    loadEl.textContent = 'WebGL2 error: ' + err;
    loadEl.style.color = '#f44';
    return;
  }

  loadEl.style.display = 'none';
  document.getElementById('stats').style.display = '';
  document.getElementById('controls').style.display = '';
  document.getElementById('clock').style.display = '';

  // Wire sliders
  for (const [id, param] of Object.entries(SLIDER_MAP)) {
    const el = document.getElementById(id);
    el.addEventListener('input', () => sim.set_param(param, +el.value));
    sim.set_param(param, +el.value);
  }

  const statsEl = document.getElementById('stats');
  const clockEl = document.getElementById('clock');
  const canvas = document.getElementById('main');
  const edgeCount = sim.edge_count();
  let frameCount = 0, lastFpsTime = performance.now(), fps = 0;
  let gravityDbg = '';

  // ── Follow-car: click to follow nearest car ──
  canvas.addEventListener('click', (e) => {
    const rect = canvas.getBoundingClientRect();
    const scaleX = canvas.width / rect.width;
    const scaleY = canvas.height / rect.height;
    const sx = (e.clientX - rect.left) * scaleX;
    const sy = (e.clientY - rect.top) * scaleY;
    const gx = (sx - canvas.width / 2) / sim.cam_zoom() + sim.cam_x();
    const gy = (sy - canvas.height / 2) / sim.cam_zoom() + sim.cam_y();
    sim.follow_car_at(gx, gy);
    sim.clear_gravity();
  });

  // ── Gravity well: mouse attracts cars ──
  canvas.addEventListener('mousemove', (e) => {
    if (sim.is_following()) { gravityDbg = 'following'; return; }
    const rect = canvas.getBoundingClientRect();
    const scaleX = canvas.width / rect.width;
    const scaleY = canvas.height / rect.height;
    const sx = (e.clientX - rect.left) * scaleX;
    const sy = (e.clientY - rect.top) * scaleY;
    const gx = (sx - canvas.width / 2) / sim.cam_zoom() + sim.cam_x();
    const gy = (sy - canvas.height / 2) / sim.cam_zoom() + sim.cam_y();
    sim.set_gravity(gx, gy);
    gravityDbg = `gravity @ ${gx.toFixed(0)},${gy.toFixed(0)}`;
  });
  canvas.addEventListener('mouseleave', () => { sim.clear_gravity(); gravityDbg = ''; });

  // ── Follow-car: keyboard shortcuts ──
  document.addEventListener('keydown', (e) => {
    if (e.key === 'f' || e.key === 'F') {
      sim.follow_random_car();
      sim.clear_gravity();
    }
    if (e.key === 'Escape') {
      sim.unfollow();
    }
  });

  function frame() {
    const s = sim.frame();

    frameCount++;
    const now = performance.now();
    if (now - lastFpsTime >= 1000) {
      fps = frameCount;
      frameCount = 0;
      lastFpsTime = now;
    }

    const h = String(s.sim_hour).padStart(2, '0');
    const m = String(s.sim_minute).padStart(2, '0');
    clockEl.textContent = `${h}:${m}`;
    const followTag = s.following ? ' · following' : '';
    const gravTag = gravityDbg ? ` · ${gravityDbg} [${s.gravity_transfers}]` : '';
    const parkTag = (s.parked_count > 0 || s.seeking_count > 0) ? `<br>${s.parked_count.toLocaleString()} parked · ${s.seeking_count.toLocaleString()} seeking` : '';
    statsEl.innerHTML = `${fps} fps · ${s.car_count.toLocaleString()} cars · ${edgeCount} edges${followTag}${gravTag}${parkTag}`;
    s.free();

    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
}

main();
</script>
</body>
</html>
